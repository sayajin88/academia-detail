<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- CRÍTICO: Preload del LCP - imagen hero -->
    <link 
      rel="preload" 
      as="image" 
      href="/src/assets/heroes/hero-home.jpg" 
      fetchpriority="high"
    />
    
    <!-- Preconnects para rendimiento -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preconnect a YouTube para el video background -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    
    <!-- Fonts - NO BLOQUEANTE -->
    <link 
      rel="preload" 
      as="style" 
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;400;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- CSS Crítico Inline -->
    <style>
      :root {
        --background: 0 0% 0%;
        --foreground: 0 0% 100%;
        --primary: 10 93% 46%;
        --primary-glow: 10 93% 56%;
      }
      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Open Sans', system-ui, sans-serif;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      .min-h-screen { min-height: 100vh; }
      #root { min-height: 100vh; }
    </style>
    
    <!-- Favicon mejorado -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ef4444">
    
    <!-- Meta básicos (serán sobrescritos por React Helmet) -->
    <title>Academia Detailing | Cursos Profesionales de Detailing, PPF y Car Wrapping</title>
    <meta name="description" content="Centro de formación líder en detailing profesional. Cursos 100% prácticos de detailing, car wrapping, PPF y restauración de vehículos. Certificación profesional en Alicante, España.">
    <meta name="keywords" content="curso detailing profesional, formación car wrapping, curso PPF España, academia detailing Alicante, certificación detailing, curso vinilado vehículos, protección pintura PPF">
    <meta name="author" content="Academia Detailing" />
    
    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    
    <!-- Geo tags para SEO local - Alicante -->
    <meta name="geo.region" content="ES-A" />
    <meta name="geo.placename" content="Alicante" />
    <meta name="geo.position" content="38.3452;-0.4892" />
    <meta name="ICBM" content="38.3452, -0.4892" />
    <meta name="language" content="Spanish">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://academiadetail.com/">
    <meta property="og:title" content="Academia Detailing | Cursos de Detailing Profesional en España">
    <meta property="og:description" content="Centro de formación líder en detailing profesional. Cursos 100% prácticos de detailing, car wrapping, PPF y restauración. Certificación profesional.">
    <meta property="og:image" content="https://academiadetail.com/og-image.png">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="Academia Detailing">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://academiadetail.com/">
    <meta name="twitter:title" content="Academia Detailing | Cursos de Detailing Profesional en España">
    <meta name="twitter:description" content="Centro de formación líder en detailing profesional. Cursos 100% prácticos de detailing, car wrapping, PPF y restauración. Certificación profesional.">
    <meta name="twitter:image" content="https://academiadetail.com/og-image.png">
    
    <!-- Canonical base -->
    <link rel="canonical" href="https://academiadetail.com/">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EQW4MPZTEW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EQW4MPZTEW');
    </script>
    
    <!-- CRÍTICO: Preload del LCP - Desktop hero -->
    <!-- NOTA: La imagen móvil ahora se procesa via Vite (src/assets/) y se carga via <picture> en el componente -->
    <!-- DESKTOP (>= 768px) - Imagen grande -->
    <link 
      rel="preload" 
      as="image" 
      href="/src/assets/heroes/hero-home.jpg" 
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    
    <!-- Preconnects para rendimiento -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preconnect a YouTube para el video background (solo desktop) -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" media="(min-width: 768px)">
    <link rel="preconnect" href="https://i.ytimg.com" media="(min-width: 768px)">
    
    <!-- Fonts - NO BLOQUEANTE (media=print -> swap on load) -->
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- CSS Crítico Inline - Expandido para above-the-fold -->
    <style>
      :root {
        --background: 240 10% 11%;
        --foreground: 0 0% 98%;
        --primary: 348 60% 34%;
        --primary-glow: 348 55% 42%;
        --muted: 240 6% 18%;
        --muted-foreground: 210 5% 78%;
      }
      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Open Sans', system-ui, sans-serif;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      .min-h-screen { min-height: 100vh; }
      #root { min-height: 100vh; }
      /* Hero crítico */
      .min-h-\[90vh\] { min-height: 90vh; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .inset-0 { inset: 0; }
      .overflow-hidden { overflow: hidden; }
      .z-10 { z-index: 10; }
      .flex { display: flex; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      /* Navbar crítico */
      .fixed { position: fixed; }
      .top-0 { top: 0; }
      .left-0 { left: 0; }
      .right-0 { right: 0; }
      .z-50 { z-index: 50; }
      .container { width: 100%; margin-left: auto; margin-right: auto; }
      @media (min-width: 1024px) { .container { max-width: 1024px; } }
      @media (min-width: 1280px) { .container { max-width: 1280px; } }
    </style>
    
    <!-- Favicon SVG (preferido por navegadores modernos y Google) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Favicon PNG fallback (48x48 para Google SERPs) -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
    <!-- Favicon ICO fallback (legacy) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ef4444">
    
    <!-- Meta básicos (serán sobrescritos por React Helmet) -->
    <title>Academia Detailing | Cursos Profesionales de Detailing, PPF y Car Wrapping</title>
    <meta name="description" content="Centro de formación líder en detailing profesional. Cursos 100% prácticos de detailing, car wrapping, PPF y restauración de vehículos. Certificación profesional en Alicante, España.">
    <meta name="keywords" content="curso detailing profesional, formación car wrapping, curso PPF España, academia detailing Alicante, certificación detailing, curso vinilado vehículos, protección pintura PPF">
    <meta name="author" content="Academia Detailing" />
    
    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    
    <!-- Geo tags para SEO local - Alicante -->
    <meta name="geo.region" content="ES-A" />
    <meta name="geo.placename" content="Alicante" />
    <meta name="geo.position" content="38.3452;-0.4892" />
    <meta name="ICBM" content="38.3452, -0.4892" />
    <meta name="language" content="Spanish">
    
    <!-- Open Graph / Facebook (fallback for non-JS crawlers) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://academiadetail.com/">
    <meta property="og:title" content="Cursos Detailing Profesional 2026 | Certificación y Práctica Real ★4.8">
    <meta property="og:description" content="Cursos de detailing 100% prácticos en taller real. Pulido, cerámico, PPF y wrapping. +218 alumnos certificados.">
    <meta property="og:image" content="https://academiadetail.com/og-image.png">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="Detail Park - Academia Detail">

    <!-- Twitter (fallback for non-JS crawlers) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://academiadetail.com/">
    <meta name="twitter:title" content="Cursos Detailing Profesional 2026 | Certificación y Práctica Real ★4.8">
    <meta name="twitter:description" content="Cursos de detailing 100% prácticos en taller real. Pulido, cerámico, PPF y wrapping. +218 alumnos certificados.">
    <meta name="twitter:image" content="https://academiadetail.com/og-image.png">
    
    <!-- Canonical base -->
    <link rel="canonical" href="https://academiadetail.com/">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Despliegue de la web en Cloudflare (Workers con assets estáticos, configurado
# en wrangler.jsonc) en cada push a main.
#
# Secretos necesarios (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# Por ahora el backend sigue en Lovable Cloud (valores de .env). Cuando exista el
# Supabase propio se añadirá aquí el job de migraciones y funciones.

name: Deploy (Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web:
    name: Web (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          command: deploy

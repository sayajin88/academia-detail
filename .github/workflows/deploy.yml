# Despliegue en cada push a main:
#   - backend: migraciones y edge functions en el Supabase propio (kvsrmbutyqyaaaukvgll)
#   - web: Cloudflare (Workers con assets estáticos, configurado en wrangler.jsonc)
#
# Secretos necesarios (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
#
# Mientras dure la migración la web sigue leyendo de Lovable Cloud (valores de
# .env); por eso los dos jobs son independientes.

name: Deploy (Cloudflare + Supabase)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Supabase (migraciones y funciones)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        run: supabase db push
      - name: Deploy edge functions
        run: |
          FNS=$(ls supabase/functions | grep -v -e "^_shared$" | tr '\n' ' ')
          supabase functions deploy $FNS --project-ref "$SUPABASE_PROJECT_REF"

  web:
    name: Web (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          command: deploy
